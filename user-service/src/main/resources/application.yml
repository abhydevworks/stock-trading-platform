spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_trading
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081
  servlet:
    context-path: /

jwt:
  secret: your-super-secret-key-change-this-in-production-environment
  expiration: 86400000

logging:
  level:
    com.stocktrading: DEBUG
    org.springframework.security: DEBUG
