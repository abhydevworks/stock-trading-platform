spring:
  application:
    name: trading-service
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_trading
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: trading-service-group

server:
  port: 8082
  servlet:
    context-path: /

logging:
  level:
    com.stocktrading: DEBUG
